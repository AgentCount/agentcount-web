name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: lint · typecheck · test · build · smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This project uses pnpm — `pnpm-lock.yaml` is the committed lockfile.
      # pnpm must be installed BEFORE setup-node, because `cache: pnpm` asks
      # pnpm where its store is and fails if the binary is not on PATH yet.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile: fail rather than silently resolve a different tree
      # than the lockfile pins. A lockfile that no longer matches package.json
      # is something to surface in CI, not to paper over.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

      # The build must succeed with NO API reachable. Every page that reads the
      # census declares `dynamic = "force-dynamic"` and renders on demand, so a
      # build that needed a live API would fail deploys exactly when the API is
      # down — which is when you most want to ship a fix. The address below is
      # a closed port on purpose: if the build ever starts depending on the
      # API, this job goes red instead of quietly passing against a real one.
      - run: pnpm run build
        env:
          AGENTCOUNT_API_URL: http://127.0.0.1:9

      # Then actually ASK THE BUILT APP FOR EVERY PAGE.
      #
      # Everything above this line passed on 2026-08-01 while every agent
      # permalink in production returned a 500 and no page had a link-preview
      # image. Neither fault is visible to a type-checker, a linter, a unit
      # test, or a build — the first only exists at request time, and the
      # second only in the served `<head>`. `scripts/smoke.ts` boots this build
      # against a stub API serving `test/fixtures` and checks both.
      - run: pnpm run smoke
